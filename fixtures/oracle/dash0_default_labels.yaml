# Label keys observed in the Dash0 `default` dataset, per metric-name prefix (development-time only).
# Hand-copied from docs/DASH0_INVENTORY.md (live inventory, 2026-11-07) and docs/handoff/00-context.md §7;
# not a complete list. scripts/crosscheck.py shows it to the Haiku verifier so that it judges label
# names against what the dataset really carries, not only against OTel catalog attribute names (the
# dataset uses newer semconv label names than some catalog entries). Never read by the converter.
dataset: default
taken: '2026-11-07'
prefixes:
  postgresql.:
    labels: [postgresql_database_name, postgresql_table_name, operation, source, service_instance_id, host_name]
    absent: [db_namespace, db_collection_name]
  system.:
    labels: [cpu_mode, cpu_logical_number, system_memory_state, system_network_direction, system_device, network_interface_name]
    absent: [state, direction]
  container.:
    labels: [container_name, container_image_name]
    absent: []
  redis.:
    labels: [redis_version]
    absent: []
  nginx.:
    labels: [state]
    absent: []
  kafka.:
    labels: [group, topic, type, service_name, service_instance_id]
    absent: []

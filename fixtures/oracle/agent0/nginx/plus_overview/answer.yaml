- source_path: 'widgets[1].definition.widgets[1].definition.requests[0]'
  outcome: translated
  promql: ['sum({otel_metric_name="nginx.connections_accepted", otel_metric_type="sum"})']
  otel_metrics: ['nginx.connections_accepted']
  labels: {host: 'host_name'}
  live_check: 'yes, 1 series (14:05-15:21 UTC; host_name=docker-desktop)'
  notes: 'Datadog nginx.connections.accepted is the cumulative total reported as a gauge, and no per_second is applied, so the raw cumulative sum is shown without rate(). Source is the OTel nginxreceiver (stub_status "accepts"), which documents the same meaning ("total number of accepted client connections"). The value resets when NGINX restarts (it dropped to 1 at about 14:55). $host default * is dropped.'
- source_path: 'widgets[1].definition.widgets[2].definition.requests[0]'
  outcome: translated
  promql: ['sum({otel_metric_name="nginx.connections_current", otel_metric_type="sum", state="active"}) - sum({otel_metric_name="nginx.connections_current", otel_metric_type="sum", state="waiting"})']
  otel_metrics: ['nginx.connections_current']
  labels: {host: 'host_name'}
  live_check: 'yes, 1 series'
  notes: 'NGINX Plus "active" leaves out idle connections, but stub_status state="active" counts them (live data shows active = reading + writing + waiting, e.g. 24 = 0 + 1 + 23). So active minus waiting is used. Mapping straight to state="active" would overcount. This is a non-monotonic sum, so no rate().'
- source_path: 'widgets[1].definition.widgets[3].definition.requests[0]'
  outcome: translated
  promql: ['sum({otel_metric_name="nginx.connections_current", otel_metric_type="sum", state="waiting"})']
  otel_metrics: ['nginx.connections_current']
  labels: {host: 'host_name'}
  live_check: 'yes, 1 series'
  notes: 'Plus "idle" maps to stub_status "Waiting", which NGINX documents as idle client connections waiting for a request. This is a non-monotonic sum, so no rate().'
- source_path: 'widgets[1].definition.widgets[4].definition.requests[0]'
  outcome: translated
  promql: ['sum(rate({otel_metric_name="nginx.connections_accepted", otel_metric_type="sum"}[$__rate_interval])) - sum(rate({otel_metric_name="nginx.connections_handled", otel_metric_type="sum"}[$__rate_interval]))']
  otel_metrics: ['nginx.connections_accepted', 'nginx.connections_handled']
  labels: {host: 'host_name'}
  live_check: 'yes, 1 series (checked with [5m] in place of $__rate_interval; value 0 throughout)'
  notes: 'There is no dropped-connections metric. Dropped is derived as accepts minus handled, the stub_status relation NGINX documents (handled equals accepts unless resource limits are hit). per_second() becomes rate(). If the derived formula is not accepted as exact, this request is blocked.'

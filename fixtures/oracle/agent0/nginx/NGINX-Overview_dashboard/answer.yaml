# Provenance only, never test input.
- source_path: 'widgets[1].definition.widgets[0].definition.requests[0]'
  outcome: translated
  promql:
    - 'sum(increase({otel_metric_name="nginx.connections_accepted", otel_metric_type="sum"}[15m])) - sum(increase({otel_metric_name="nginx.connections_handled", otel_metric_type="sum"}[15m]))'
  otel_metrics: [nginx.connections_accepted, nginx.connections_handled]
  labels: {}
  live_check: "yes, 1 series (window 14:05-15:21 UTC; value 0 throughout)"
  notes: "The dataset has no dropped-connections metric. The Datadog nginx check computes nginx.net.conn_dropped_per_s as the rate of (accepts - handled), so this query takes the difference of the two OTel counters, and .as_count() becomes a 15m total. It assumes the query_value aggregator is sum over the widget's 15m window. Datadog drops the sample on a counter reset, while PromQL increase() handles each counter's reset separately. Both counters have one series at a time, so sum() does not double-count."

- source_path: 'widgets[4].definition.widgets[0].definition.requests[0]'
  outcome: translated
  promql:
    - 'avg(rate({otel_metric_name="nginx.requests", otel_metric_type="sum"}[$__rate_interval]))'
  otel_metrics: [nginx.requests]
  labels: {}
  live_check: "yes, 1 series (window 14:05-15:21 UTC; about 1.9-4.0 req/s)"
  notes: "nginx.requests is a monotonic sum of total requests, and its per-second rate matches Datadog's rate-type nginx.net.request_per_s. avg() is across hosts. The query_value's time aggregation (avg/last) is applied by the panel's reduction, not by PromQL."

- source_path: 'widgets[4].definition.widgets[1].definition.requests.fill'
  outcome: translated
  promql:
    - 'avg by (host_name) (rate({otel_metric_name="nginx.requests", otel_metric_type="sum"}[$__rate_interval]))'
  otel_metrics: [nginx.requests]
  labels: {host: host_name}
  live_check: "yes, 1 series (host_name=docker-desktop)"
  notes: "Datadog host is the agent hostname. host_name comes from the OTel host.name resource attribute, so the values may differ from the Datadog host names. Perses has no hostmap panel, so a table or bar panel per host_name is needed."

- source_path: 'widgets[4].definition.widgets[4].definition.requests[0]'
  outcome: translated
  promql:
    - 'sum({otel_metric_name="nginx.connections_current", otel_metric_type="sum", state="reading"})'
  otel_metrics: [nginx.connections_current]
  labels: {}
  live_check: "yes, 1 series (value 0 throughout)"
  notes: "$Host defaults to * and is dropped. nginx.connections_current is a point-in-time connection count split by state, so it is used as-is with no rate(). The state label values are active, reading, waiting and writing."


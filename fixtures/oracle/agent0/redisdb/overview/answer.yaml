- source_path: 'widgets[4].definition.widgets[4].definition.requests[0]'
  outcome: translated
  promql:
    - 'sum(increase({otel_metric_name="redis.connections.rejected", otel_metric_type="sum"}[$__interval]))'
  otel_metrics: [redis.connections.rejected]
  labels: {host: host_name}
  live_check: "yes, 1 series"
  notes: "In Datadog, redis.net.rejected is a cumulative gauge, and diff() takes the delta per interval on each series before space aggregation. increase() over $__interval inside sum() keeps that order. increase() extrapolates and treats a counter reset as continuation, where diff() would go negative. $__interval must be at least 20s, since the scrape interval is 10s. The value was 0 throughout the window."


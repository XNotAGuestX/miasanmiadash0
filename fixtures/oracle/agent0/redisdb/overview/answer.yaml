- source_path: 'widgets[1].definition.widgets[0].definition.requests[0]'
  outcome: translated
  promql:
    - '(avg(rate({otel_metric_name="redis.keyspace.hits", otel_metric_type="sum"}[$__rate_interval])) / (avg(rate({otel_metric_name="redis.keyspace.hits", otel_metric_type="sum"}[$__rate_interval])) + avg(rate({otel_metric_name="redis.keyspace.misses", otel_metric_type="sum"}[$__rate_interval])))) * 100'
  otel_metrics: [redis.keyspace.hits, redis.keyspace.misses]
  labels: {host: host_name}
  live_check: "yes, 1 series (14:05-15:21 UTC)"
  notes: "The Datadog check submits keyspace_hits and keyspace_misses with self.rate (per second). The OTel metrics are monotonic cumulative sums, so rate() matches that. The result is NaN when there are no lookups, the same as in Datadog. The query_value reducer has to be set on the Perses stat panel."


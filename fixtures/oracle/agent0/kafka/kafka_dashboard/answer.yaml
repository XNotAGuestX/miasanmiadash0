- source_path: 'widgets[3].definition.widgets[2].definition.requests[0]'
  outcome: translated
  promql:
    - 'max(rate({otel_metric_name="kafka.isr.operation.count", otel_metric_type="sum", operation="expand"}[$__rate_interval])) - max(rate({otel_metric_name="kafka.isr.operation.count", otel_metric_type="sum", operation="shrink"}[$__rate_interval]))'
  otel_metrics: [kafka.isr.operation.count]
  labels: {}
  live_check: "yes, 1 series (window 14:05-15:21 UTC), value 0"
  notes: "The two Datadog metrics map to one OTel counter split by the operation label (expand, shrink). Datadog's .rate is the JMX OneMinuteRate, a smoothed per-second rate, while PromQL rate() over the counter is also per second but averaged over the rate interval, so the smoothing differs. $env is dropped"


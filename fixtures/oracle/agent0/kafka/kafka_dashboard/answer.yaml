- source_path: 'widgets[3].definition.widgets[0].definition.requests[0]'
  outcome: translated
  promql:
    - 'sum({otel_metric_name="kafka.partition.offline", otel_metric_type="sum"})'
  otel_metrics: [kafka.partition.offline]
  labels: {}
  live_check: "yes, 1 series (window 14:05-15:21 UTC), value 0"
  notes: "Both metrics read the same broker JMX MBean (KafkaController OfflinePartitionsCount); the OTel side comes from scope io.opentelemetry.jmx. It is a non-monotonic sum (a gauge-like value), so no rate() is applied. Only the active controller reports a non-zero value, so summing across brokers matches Datadog. .weighted() has no PromQL counterpart and does not change the instant sum"


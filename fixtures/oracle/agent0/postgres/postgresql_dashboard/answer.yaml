# Agent0 answer, verbatim. Asked 2026-11-07 ~17:19 local (Dash0 UI chat, Advanced/High), prompt: prompt.md.
# Provenance only, never test input.
# Live-check window: last 1h = 2026-11-07T15:21:17Z..16:21:17Z (16:21–17:21 local).
# None of the postgresql.* / system.* metrics below has a sample after ~15:21 UTC, so every last-hour check returns 0 series.
# The "earlier window" counts in each notes field come from running the same PromQL over 14:00–15:25 UTC,
# with $__rate_interval replaced by [10m] because the samples are sparse.
- source_path: "widgets[0].definition.requests[0]"
  outcome: translated
  promql:
    - 'avg(rate({otel_metric_name="postgresql.tup_fetched", otel_metric_type="sum"}[$__rate_interval]))'
  otel_metrics: [postgresql.tup_fetched]
  labels: {}
  live_check: "no, 0 series in last 1h (1 series in the earlier window)"
  notes: "Both metrics come from pg_stat_database.tup_fetched: Datadog rows_fetched is that counter as a per-second rate, and the OTel postgresqlreceiver 0.160.0 metric is a monotonic sum, so rate() gives rows/s. avg() across databases and hosts matches Datadog's default space aggregation."
- source_path: "widgets[0].definition.requests[1]"
  outcome: translated
  promql:
    - 'avg(rate({otel_metric_name="postgresql.tup_returned", otel_metric_type="sum"}[$__rate_interval]))'
  otel_metrics: [postgresql.tup_returned]
  labels: {}
  live_check: "no, 0 series in last 1h (1 series in the earlier window)"
  notes: "Source column is pg_stat_database.tup_returned; result is rows/s, averaged across all databases."
- source_path: "widgets[0].definition.requests[2]"
  outcome: translated
  promql:
    - 'avg(rate({otel_metric_name="postgresql.tup_inserted", otel_metric_type="sum"}[$__rate_interval]))'
  otel_metrics: [postgresql.tup_inserted]
  labels: {}
  live_check: "no, 0 series in last 1h (1 series in the earlier window)"
  notes: "Source column is pg_stat_database.tup_inserted; result is rows/s. Do not use postgresql.operations{operation=ins}: that is a per-table metric from pg_stat_user_tables, so it is a different population."
- source_path: "widgets[0].definition.requests[3]"
  outcome: translated
  promql:
    - 'avg(rate({otel_metric_name="postgresql.tup_updated", otel_metric_type="sum"}[$__rate_interval]))'
  otel_metrics: [postgresql.tup_updated]
  labels: {}
  live_check: "no, 0 series in last 1h (1 series in the earlier window)"
  notes: "Source column is pg_stat_database.tup_updated; result is rows/s."
- source_path: "widgets[1].definition.requests[0]"
  outcome: translated
  promql:
    - 'avg by (postgresql_database_name) ({otel_metric_name="postgresql.backends", otel_metric_type="sum"})'
  otel_metrics: [postgresql.backends]
  labels: {db: postgresql_database_name}
  live_check: "no, 0 series in last 1h (2 series in the earlier window: astronomy_db, postgres)"
  notes: "Datadog postgresql.connections is pg_stat_database.numbackends. postgresql.backends is a non-monotonic sum (a gauge-like value), so no rate() is applied. Its description says it counts all backend types, including autovacuum and parallel workers; numbackends counts those too."
- source_path: "widgets[2].definition.requests[0]"
  outcome: translated
  promql:
    - 'avg(rate({otel_metric_name="postgresql.tup_inserted", otel_metric_type="sum"}[$__rate_interval]))'
    - 'avg(rate({otel_metric_name="postgresql.tup_deleted", otel_metric_type="sum"}[$__rate_interval]))'
    - 'avg(rate({otel_metric_name="postgresql.tup_updated", otel_metric_type="sum"}[$__rate_interval]))'
  otel_metrics: [postgresql.tup_inserted, postgresql.tup_deleted, postgresql.tup_updated]
  labels: {}
  live_check: "no, 0 series in last 1h (3 series in the earlier window, 1 per formula)"
  notes: "The queries have no explicit aggregator, which Datadog treats as avg, hence avg(). Formula order is inserted, deleted, updated, as in the source."
- source_path: "widgets[3].definition.requests[0]"
  outcome: translated
  promql:
    - '100 * avg(rate({otel_metric_name="system.disk.io_time", otel_metric_type="sum"}[$__rate_interval]))'
  otel_metrics: [system.disk.io_time]
  labels: {}
  live_check: "no, 0 series in last 1h (1 series in the earlier window)"
  notes: "system.io.util is iostat %util, which is the change in busy time divided by elapsed time. rate(system.disk.io_time in seconds) * 100 gives the same per-device percentage, averaged across all devices. OTel reports every system.device and none are filtered out, so the device set (loop devices, partitions) can differ from the Datadog agent's."

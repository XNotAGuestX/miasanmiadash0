  otel_metrics: [system.network.io]
  labels: {}
  live_check: "no, 0 series in last 1h (1 series in the earlier window)"
  notes: "Result is bytes/s summed across all network_interface_name values and hosts. system.network.io comes from both collector hostmetrics (docker-desktop) and Python system_metrics (load-generator), and both are included. Loopback and virtual interfaces are not excluded, so totals can exceed a Datadog agent that skips lo."

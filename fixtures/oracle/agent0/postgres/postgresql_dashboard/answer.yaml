- source_path: "widgets[5].definition.requests[0]"
  outcome: blocked
  reason: "No equivalent metric for query6 (system.cpu.guest). system.cpu.time and system.cpu.utilization only carry cpu_mode values idle, interrupt, irq, nice, softirq, steal, system, user and wait. No mode or metric reports guest time, and the request is all-or-nothing."
  otel_metrics: [system.cpu.time]
  labels: {}
  live_check: "not run as a translation; system.cpu.time also has 0 series in last 1h"
  notes: "The other five formulas could map to 100 * avg(rate(system.cpu.time{cpu_mode=idle|system|wait|user|steal})), but guest has no counterpart. system.cpu.time also has a second source, Python opentelemetry.instrumentation.system_metrics on the load-generator resources, alongside the collector hostmetrics on docker-desktop."
- source_path: "widgets[6].definition.requests[0]"
  outcome: translated
  promql:
    - '100 * max(avg by (host_name) (rate({otel_metric_name="system.cpu.time", otel_metric_type="sum", cpu_mode="wait"}[$__rate_interval])))'
  otel_metrics: [system.cpu.time]
  labels: {host: host_name}
  live_check: "no, 0 series in last 1h (1 series in the earlier window, host docker-desktop)"
  notes: "Datadog system.cpu.iowait is a per-host percentage averaged across cores. Here that is avg over cpu_logical_number of the per-core rate of wait seconds, computed per host, then max across hosts for the max: aggregator. host_name is only an internal grouping key, and the output is a single series. The OTel mode 'wait' corresponds to /proc/stat iowait."
- source_path: "widgets[7].definition.requests[0]"
  outcome: blocked
  reason: "No equivalent metric for query1 (system.mem.usable, which is MemAvailable). The dataset has system.memory.usage with system_memory_state values buffered, cached, free, slab_reclaimable, slab_unreclaimable and used, plus system.memory.limit and system.memory.utilization. It has no 'available' state and no system.linux.memory.available. Summing free+buffered+cached(+slab_reclaimable) only approximates MemAvailable, so query1 and 'query2 - query1' cannot be expressed exactly."
  otel_metrics: [system.memory.usage, system.memory.limit]
  labels: {}
  live_check: "not run as a translation"
  notes: "query2 (system.mem.total) alone could map to sum(system.memory.limit), but the request is all-or-nothing."

# Claude Haiku cross-check of each candidate against the Datadog request (scripts/crosscheck.py input).
# haiku verdicts for kafka/kafka_dashboard. Triage only, never approval: humans set reviewed: true.
verifier: haiku
meta:
  tool: scripts/crosscheck.py
  model: claude-haiku-5-5
  effort: medium
  max_tokens: 16000
  structured_output: output_config.format json_schema
  system_prompt_sha256: e0d8b72a4befbaa6388399933cfa793d987b2671eb1ddcc83e53b654c0a46971
  schema_sha256: db0053dd6f2478874e3174dd255c1254e11ec857cb649947efa0e76e6856f9c1
  cache: fixtures/oracle/verify/.haiku-cache
results:
- source_path: widgets[3].definition.widgets[2].definition.requests[0]#agg_swap
  verdict: block
  reasons:
  - 'aggregation differs: the Datadog query uses max: for both operands, but the candidate applies min() to the expand rate and max() to the shrink rate, so the difference is not the same computation.'
  - 'series selection differs: the Datadog {$env} tag-prefixed template variable (default *) should become an env matcher (env=~"$env"), but the candidate drops it.'
  - 'label name is unverified against the dataset: the candidate matches operation="expand"/"shrink", but the observed dataset labels for kafka.isr.operation.count are group, topic, type, service_name and service_instance_id, with no operation label, so the matchers would select nothing. The label is likely type in the dataset.'
  - 'quantity and unit are consistent: both sides are per-second rates of ISR expand and shrink operations on a monotonic sum, so rate() is appropriate, and the translation outcome is reasonable because the metric exists.'
  checks:
    quantity: ok
    unit: ok
    aggregation: differs
    grouping: ok
    series_count: differs
    outcome: ok
  method: haiku
  cache: 083bdb14c7a07520
- source_path: widgets[3].definition.widgets[2].definition.requests[0]#rate_on_gauge
  verdict: block
  reasons:
  - 'The expand selector uses otel_metric_type="gauge", but kafka.isr.operation.count is defined as a monotonic sum (dataset_types: sum). The selector matches nothing, so the expand side is empty and the formula breaks. It should be otel_metric_type="sum" and it is still a rate over a sum, which is valid.'
  - The Datadog query filters on {$env}, a template variable with prefix env and default *. The candidate drops that matcher, so it returns all environments. It should carry env=~"$env". The label name cannot be confirmed because 'env' is not in the observed dataset labels (the deployment-environment label may use a newer name), so the label must be checked against the dataset before the matcher is finalised.
  - Quantity, unit, aggregation (max over rate of a monotonic count, matching Datadog .rate with max) and grouping (none in Datadog, none in candidate) are consistent. The outcome of translated is appropriate since no function is used. The series set is wrong because of the dropped env filter.
  checks:
    quantity: ok
    unit: ok
    aggregation: ok
    grouping: ok
    series_count: differs
    outcome: ok
  method: haiku
  cache: d7ac46557ab507e7
- source_path: widgets[3].definition.widgets[2].definition.requests[0]#add_scale
  verdict: block
  reasons:
  - The candidate multiplies the result by 100, a numeric constant not in the Datadog source (the request is a plain max(...) - max(...) difference), so it computes a different quantity.
  - The candidate uses the label `operation`, which is not among the observed dataset labels for kafka.isr.operation.count (group, topic, type, service_name, service_instance_id). Per the dataset rules, the observed label names are authoritative, so the selector is wrong and the series filter would match nothing unless `type` is the renamed equivalent, which must be verified.
  - The `{$env}` template variable has prefix `env` and default `*`, so it should become an `env=~"$env"` matcher. The candidate drops it, so the series set differs from the Datadog request.
  - Aggregation (max of rate per query) and the difference of the two series match the Datadog formula, and translating rather than blocking is plausible since a monotonic OTel sum exists.
  checks:
    quantity: differs
    unit: ok
    aggregation: ok
    grouping: ok
    series_count: differs
    outcome: ok
  method: haiku
  cache: 73693e74b10ced17
- source_path: widgets[3].definition.widgets[2].definition.requests[0]#range_change
  verdict: block
  reasons:
  - 'Range violates the hard rule: the expand side uses rate(...[5m]) instead of [$__rate_interval].'
  - The {$env} filter is dropped. The template variable has prefix env and default '*', so the PromQL should carry env=~"$env" on both selectors; the candidate selects all series.
  - 'Label name is likely wrong: the candidate matches operation="expand"/"shrink", but the dataset''s observed labels for kafka.isr.operation.count include ''type'' and not ''operation''. Per the dataset-authority rule the label should be ''type'' (values unverified).'
  - Quantity, unit (per-second rate of ISR operation counts) and the max aggregation match the Datadog request; outcome 'translated' is the right outcome since an exact mapping exists.
  checks:
    quantity: ok
    unit: ok
    aggregation: ok
    grouping: ok
    series_count: differs
    outcome: ok
  method: haiku
  cache: 4d856726984572a6
- source_path: widgets[3].definition.widgets[2].definition.requests[0]#outcome_flip
  verdict: pass
  reasons:
  - Candidate blocks with MISSING_METRIC_MAPPING, which is the allowed outcome when no OTel metric measures the same quantity.
  - otel_metric_definitions is empty, so no OTel metric is shown for kafka.replication.isr_expands.rate or isr_shrinks.rate; the block cannot be checked against a real mapping and is accepted on that basis.
  - Both queries are rate-style Datadog kafka replication counters with no OTel definition supplied, so blocking the formula query1 - query2 is consistent with the hard rules.
  checks:
    quantity: n/a
    unit: n/a
    aggregation: n/a
    grouping: n/a
    series_count: n/a
    outcome: ok
  method: haiku
  cache: c0a6908931229ea7

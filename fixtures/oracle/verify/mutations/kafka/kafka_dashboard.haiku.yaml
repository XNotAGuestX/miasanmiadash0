    aggregation: ok
    grouping: ok
    series_count: differs
    outcome: ok
  method: haiku
  cache: d7ac46557ab507e7
- source_path: widgets[3].definition.widgets[2].definition.requests[0]#add_scale
  verdict: block
  reasons:
  - The candidate multiplies the result by 100, a numeric constant that does not appear in the Datadog source (query1 - query2). The converter must not apply scaling; any percent-vs-ratio note belongs in notes only.
  - The selector matches label operation="expand"/"shrink", but the dataset's observed labels for kafka.isr.operation.count are group, topic, type, service_name and service_instance_id. The operation label is not observed, so the PromQL would select nothing. The correct dataset label (possibly type) is not verified here.
  - The Datadog {$env} filter is a template variable with tag prefix env and default *, so it should become an env label matcher (env=~"$env"). The candidate drops it, so it selects a different set of series.
  - The Datadog metrics kafka.replication.isr_expands.rate and isr_shrinks.rate map to the expand and shrink counts of the same OTel metric, so the quantity and max aggregation are plausibly equivalent. Because the label and scaling problems remain, the candidate is not an exact translation.
  checks:
    quantity: ok
    unit: differs
    aggregation: ok
    grouping: ok
    series_count: differs
    outcome: differs
  method: haiku
  cache: 73693e74b10ced17

  verdict: block
  reasons:
  - The first term uses min(rate(...)) while Datadog's query1 uses max, so the aggregation differs.
  - The $env template variable (prefix env, default *) should become env=~"$env", but the candidate drops it, changing the set of series.
  - 'The label operation is not in the observed dataset labels for kafka.isr.operation.count (observed: group, topic, type, service_name, service_instance_id). The expand/shrink split likely needs the observed label name (probably type), so the matchers as written may select nothing.'
  - 'The mapping itself is reasonable: kafka.isr.operation.count is a monotonic sum measuring ISR operations, so rate() is valid and the outcome translated is correct.'
  checks:
    quantity: ok
    unit: ok
    aggregation: differs
    grouping: differs
    series_count: differs
    outcome: ok
  method: haiku
  cache: 083bdb14c7a07520
- source_path: widgets[3].definition.widgets[2].definition.requests[0]#rate_on_gauge
  verdict: block
  reasons:
  - The expand selector uses otel_metric_type="gauge", but kafka.isr.operation.count is defined as a monotonic sum and the dataset only has type sum, so that selector matches no series and the difference cannot be computed.
  - The Datadog query carries the {$env} template variable (prefix env, default *), which should become env=~"$env" on both selectors. The candidate drops it, so the series set differs from the Datadog request.
  - 'The metric mapping itself is reasonable: isr_expands and isr_shrinks map to operation=expand and operation=shrink on kafka.isr.operation.count, rate() is applied to a monotonic sum, and the unit (operations per second) matches. The translation outcome is therefore correct, but the PromQL is not.'
